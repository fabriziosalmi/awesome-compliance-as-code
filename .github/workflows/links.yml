name: links

on:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: verify catalog hyperlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run URL reachability verifier
        run: python3 scripts/check_links.py
