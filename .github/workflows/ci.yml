name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: catalog, examples, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate README structure and example synchronization
        run: |
          python3 scripts/validate_readme.py
          python3 scripts/build_site.py --output _site

      - name: Run validator unit and break tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate YAML and JSON reference artifacts
        run: |
          python3 -c '
          import json, pathlib
          data = json.loads(pathlib.Path("examples/oscal/cra_component_definition.json").read_text())
          assert "component-definition" in data
          '

      - name: Install Open Policy Agent and run Rego unit tests
        run: |
          curl -sSfL -o opa https://openpolicyagent.org/downloads/v1.2.0/opa_linux_amd64_static
          chmod +x opa
          ./opa check --strict examples/opa/
          ./opa test examples/opa/ -v
