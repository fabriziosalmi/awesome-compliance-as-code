name: slopless

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyse:
    name: AI-slop static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run slopless
        uses: fabriziosalmi/slopless@dbee19ee7aeb728821c0886fe02bea67b14eeb25 # v1.17.0
        with:
          patterns: "*.md scripts/**/*.py tests/**/*.py"
          format: sarif
          output: slopless.sarif

      - name: Upload findings to code scanning
        id: upload
        if: >-
          always()
          && github.event.repository.private == false
          && hashFiles('slopless.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: slopless.sarif
          category: slopless
